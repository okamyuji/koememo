name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    uses: okamyuji/reusable-workflows/.github/workflows/flutter-ci.yml@v1
    with:
      # *.g.dart is gitignored and generated by build_runner
      build-runner: true

  security:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1
